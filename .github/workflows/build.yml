name: Build VirtualDub2 x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout fork (patch lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout upstream sources 2.5.7
        uses: actions/checkout@v4
        with:
          repository: v0lt/VirtualDub2
          ref: 2.5.7
          path: vd
          fetch-depth: 0

      - name: Apply menu patch
        shell: bash
        working-directory: vd
        run: git apply --whitespace=nowarn ../fork/menu-changes.patch

      - name: Generate revision.h
        shell: cmd
        working-directory: vd
        run: call update_revision.cmd

      - name: Install DirectX June 2010 runtime (d3dx9_43.dll)
        shell: pwsh
        run: |
          $dll = "$env:WINDIR\SysWOW64\d3dx9_43.dll"
          if (-not (Test-Path $dll)) {
            choco install directx -y --no-progress
          }
          if (-not (Test-Path $dll)) {
            $tmp = Join-Path $env:RUNNER_TEMP "dx"
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            Invoke-WebRequest "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe" -OutFile "$tmp\dx.exe"
            Start-Process "$tmp\dx.exe" -ArgumentList "/Q /T:$tmp\x" -Wait
            expand.exe "$tmp\x\Jun2010_d3dx9_43_x86.cab" -F:d3dx9_43.dll "$env:WINDIR\SysWOW64"
          }
          if (-not (Test-Path $dll)) { throw "d3dx9_43.dll still missing" }
          Write-Host "d3dx9_43.dll OK"

      - name: Install YASM
        shell: pwsh
        run: choco install yasm -y --no-progress

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        shell: pwsh
        working-directory: vd
        run: msbuild VirtualDub2.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualDub2-x86
          path: vd/_out/**/VirtualDub2.exe
